<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Lead Dashboard — Admin</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background: #f2f6f9; }
    .admin-header {
      background: var(--primary);
      color: #fff;
      padding: 18px 0;
      margin-bottom: 24px;
    }
    .admin-header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .admin-header h1 { margin: 0; font-size: 1.25rem; }
    .status-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .status-chip {
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .status-chip .count {
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      font-size: 0.8rem;
      padding: 1px 9px;
    }
    .lead-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .lead-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .lead-name { font-weight: 800; font-size: 1.05rem; margin: 0; }
    .lead-time { color: var(--muted); font-size: 0.85rem; margin: 0; }
    .lead-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px 20px;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    .lead-grid a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .lead-grid a:hover { text-decoration: underline; }
    .lead-label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; }
    .lead-service {
      display: inline-block;
      background: rgba(15, 76, 129, 0.08);
      color: var(--primary);
      font-weight: 700;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.85rem;
    }
    .lead-message {
      background: var(--surface-alt);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.92rem;
      margin-top: 8px;
    }
    .lead-status { display: flex; align-items: center; gap: 10px; }
    .lead-status select {
      min-height: 44px;
      padding: 8px 12px;
      font: inherit;
      font-weight: 600;
      border: 1.5px solid #c8d5e0;
      border-radius: 10px;
      background: #fff;
    }
    .lead-status select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,76,129,.15); }
    .status-New select { border-color: #93c5fd; }
    .status-Contacted select { border-color: #fbbf24; }
    .status-Scheduled select { border-color: #a78bfa; }
    .status-Completed select { border-color: #34d399; }
    .empty-state {
      text-align: center;
      color: var(--muted);
      background: #fff;
      border: 1px dashed var(--line);
      border-radius: 14px;
      padding: 48px 20px;
    }
    .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    .btn-refresh {
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 999px;
      padding: 10px 20px;
      font: inherit;
      font-weight: 700;
      min-height: 44px;
      cursor: pointer;
    }
    .btn-refresh:hover { background: var(--primary-dark); }
    @media (min-width: 700px) {
      .lead-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="admin-header">
    <div class="container">
      <h1 id="admin-title">Lead Dashboard</h1>
      <a href="/" style="color:#9fd0f5;font-weight:600;text-decoration:none">← View website</a>
    </div>
  </div>

  <div class="container">
    <div class="status-chips" id="status-chips"></div>
    <div class="toolbar">
      <p style="margin:0;color:var(--muted)" id="lead-count"></p>
      <button class="btn-refresh" id="refresh-btn" type="button">↻ Refresh</button>
    </div>
    <div id="leads-list"><p style="color:var(--muted)">Loading leads…</p></div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
